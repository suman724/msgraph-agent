[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msgraph-agent"
version = "0.1.0"
description = "Google ADK Agent for Microsoft Graph (Email, Calendar, OneDrive)"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
include = ["agent_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
